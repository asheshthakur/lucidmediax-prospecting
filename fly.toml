app = "lucidmediax-prospecting"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3500"

[http_service]
  internal_port = 3500
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "prospects_data"
  destination = "/app/data"
