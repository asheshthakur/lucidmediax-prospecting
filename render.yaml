services:
  - type: web
    name: lucidmediax-prospecting
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
    disk:
      name: lucidmediax-prospects-data
      mountPath: /app/data
      sizeGB: 1
